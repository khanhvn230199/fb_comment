services:
  postgres:
    image: postgres:16-alpine
    container_name: fb_comment_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fb_comment
    ports:
      - "5435:5432"
    volumes:
      - fb_comment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fb_comment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fb_comment_postgres_data:
