services:
  postgres:
    image: postgres:16-alpine
    container_name: fb_comment_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-fb_comment}
    ports:
      - "5435:5432"
    volumes:
      - fb_comment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fb_comment}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-fb_comment:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fb_comment_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_DSN: "host=postgres user=${DB_USER:-postgres} password=${DB_PASSWORD:-postgres} dbname=${DB_NAME:-fb_comment} port=5432 sslmode=${DB_SSLMODE:-disable} TimeZone=${DB_TIMEZONE:-Asia/Ho_Chi_Minh}"
      APP_PORT: 8080
      SCRAPER_HEADLESS: ${SCRAPER_HEADLESS:-true}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: "1gb"

volumes:
  fb_comment_postgres_data:
