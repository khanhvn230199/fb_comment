<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; }
        .app { min-height: 100vh; display: flex; }
        .sidebar { position: sticky; top: 0; width: 240px; height: 100vh; padding: 24px 16px; box-sizing: border-box; color: #fff; background: #111827; }
        .brand { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
        .brand-sub { color: #9ca3af; font-size: 13px; margin-bottom: 24px; }
        .side-nav a, .side-nav button { display: block; width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 11px 12px; border: 0; border-radius: 10px; color: #d1d5db; background: transparent; text-align: left; text-decoration: none; font-size: 15px; font-weight: 700; cursor: pointer; }
        .side-nav a:hover, .side-nav button:hover, .side-nav .active { color: #fff; background: #2563eb; }
        .side-nav form { margin: 16px 0 0; }
        .content { flex: 1; min-width: 0; padding: 32px; }
        .card { max-width: 520px; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
        h1 { margin-top: 0; }
        label { display: block; margin: 16px 0 6px; font-weight: 600; }
        input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
        button.primary { margin-top: 20px; padding: 11px 16px; border: 0; border-radius: 8px; color: #fff; background: #2563eb; font-weight: 700; cursor: pointer; }
        .success { margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; color: #166534; background: #dcfce7; }
        .error { margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; color: #991b1b; background: #fee2e2; }
        .muted { color: #6b7280; }
        @media (max-width: 900px) { .app { display: block; } .sidebar { position: static; width: auto; height: auto; } .content { padding: 16px; } }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">fb_comment</div>
        <div class="brand-sub">Facebook comment tracker</div>
        <nav class="side-nav">
            <a href="/comments">Comments</a>
            <a href="/links?active=true">Links</a>
            <a href="/users" class="active">Users</a>
            <a href="/resources">Resources</a>
            <form method="post" action="/logout">
                <button type="submit">Logout</button>
            </form>
        </nav>
    </aside>
    <main class="content">
        <div class="card">
            <h1>Đổi mật khẩu</h1>
            <p class="muted">Cập nhật mật khẩu đăng nhập cho tài khoản hiện tại. Chức năng này nằm trong module User.</p>
            {{if eq .success "password_updated"}}<div class="success">Cập nhật mật khẩu thành công.</div>{{end}}
            {{if .error}}<div class="error">{{.error}}</div>{{end}}
            <form method="post" action="/password">
                <label for="old_password">Mật khẩu hiện tại</label>
                <input id="old_password" name="old_password" type="password" autocomplete="current-password" required>

                <label for="new_password">Mật khẩu mới</label>
                <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="6" required>

                <label for="confirm_password">Nhập lại mật khẩu mới</label>
                <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="6" required>

                <button class="primary" type="submit">Cập nhật mật khẩu</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
