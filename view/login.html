<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; }
        .card { width: 360px; margin: 80px auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
        h1 { margin-top: 0; font-size: 24px; }
        label { display: block; margin: 16px 0 6px; font-weight: 600; }
        input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
        button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 8px; color: #fff; background: #2563eb; font-weight: 700; cursor: pointer; }
        .error { margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; color: #991b1b; background: #fee2e2; }
        .hint { color: #6b7280; font-size: 13px; margin-top: 14px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Đăng nhập</h1>
    {{if .error}}<div class="error">{{.error}}</div>{{end}}
    <form method="post" action="/login">
        <label for="username">Tài khoản</label>
        <input id="username" name="username" autocomplete="username" required>

        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Đăng nhập</button>
    </form>
    <p class="hint">Mặc định lần đầu: admin / 123456789. Có thể đổi bằng ADMIN_USERNAME và ADMIN_PASSWORD.</p>
</div>
</body>
</html>
