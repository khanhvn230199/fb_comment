<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sửa user</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; }
        .app { min-height: 100vh; display: flex; }
        .sidebar { position: sticky; top: 0; width: 240px; height: 100vh; padding: 24px 16px; box-sizing: border-box; color: #fff; background: #111827; }
        .brand { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
        .brand-sub { color: #9ca3af; font-size: 13px; margin-bottom: 24px; }
        .side-nav a, .side-nav button { display: block; width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 11px 12px; border: 0; border-radius: 10px; color: #d1d5db; background: transparent; text-align: left; text-decoration: none; font-size: 15px; font-weight: 700; cursor: pointer; }
        .side-nav a:hover, .side-nav button:hover, .side-nav .active { color: #fff; background: #2563eb; }
        .side-nav form { margin: 16px 0 0; }
        .content { flex: 1; min-width: 0; padding: 32px; }
        .card { max-width: 760px; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
        h1 { margin-top: 0; }
        label { display: block; margin: 16px 0 6px; font-weight: 600; }
        input, select { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
        button, .button { display: inline-block; margin-top: 20px; padding: 11px 16px; border: 0; border-radius: 8px; color: #fff; background: #2563eb; font-weight: 700; cursor: pointer; text-decoration: none; }
        .secondary { background: #6b7280; }
        .error { margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; color: #991b1b; background: #fee2e2; }
        .muted { color: #6b7280; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 14px; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        @media (max-width: 900px) { .app { display: block; } .sidebar { position: static; width: auto; height: auto; } .content { padding: 16px; } .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">fb_comment</div>
        <div class="brand-sub">Facebook comment tracker</div>
        <nav class="side-nav">
            <a href="/comments">Comments</a>
            <a href="/links?active=true">Links</a>
            <a href="/users" class="active">Users</a>
            <a href="/resources">Resources</a>
            <form method="post" action="/logout">
                <button type="submit">Logout</button>
            </form>
        </nav>
    </aside>
    <main class="content">
        <div class="card">
            <h1>Sửa user #{{.user.ID}}</h1>
            <p class="muted">Để trống mật khẩu mới nếu muốn giữ mật khẩu hiện tại. Limit = 0 nghĩa là không giới hạn.</p>
            {{if .error}}<div class="error">{{.error}}</div>{{end}}

            <form method="post" action="/users/{{.user.ID}}">
                <div class="grid">
                    <div>
                        <label for="username">Username</label>
                        <input id="username" name="username" value="{{.user.Username}}" minlength="3" maxlength="100" required>
                    </div>
                    <div>
                        <label for="role">Role</label>
                        <select id="role" name="role">
                            <option value="user" {{if eq .user.Role "user"}}selected{{end}}>user</option>
                            <option value="admin" {{if eq .user.Role "admin"}}selected{{end}}>admin</option>
                        </select>
                    </div>
                    <div>
                        <label for="link_on_limit">Limit link on</label>
                        <input id="link_on_limit" name="link_on_limit" type="number" min="0" step="1" value="{{.user.LinkOnLimit}}">
                    </div>
                    <div>
                        <label for="link_off_limit">Limit link off</label>
                        <input id="link_off_limit" name="link_off_limit" type="number" min="0" step="1" value="{{.user.LinkOffLimit}}">
                    </div>
                    <div>
                        <label for="like_limit">Limit like</label>
                        <input id="like_limit" name="like_limit" type="number" min="0" step="1" value="{{.user.LikeLimit}}">
                    </div>
                    <div>
                        <label for="daily_limit">Limit ngày</label>
                        <input id="daily_limit" name="daily_limit" type="number" min="0" step="1" value="{{.user.DailyLimit}}">
                    </div>
                </div>

                <label for="password">Mật khẩu mới</label>
                <input id="password" name="password" type="password" minlength="6" placeholder="Để trống nếu không đổi">

                <div class="actions">
                    <button type="submit">Cập nhật</button>
                    <a class="button secondary" href="/users">Quay lại</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
